{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
            padding: 10px 0;
        }
        .card-header {
            background: #0d6efd;
            color: #fff;
            border-radius: 16px 16px 0 0 !important;
            padding: 18px 28px;
            font-weight: 600;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-header h5 {
            margin: 0;
            font-weight: 600;
        }
        .back-link {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255,255,255,0.15);
            padding: 6px 16px;
            border-radius: 30px;
            transition: 0.2s;
        }
        .back-link:hover {
            background: rgba(255,255,255,0.30);
            color: #fff;
        }
        .back-link i {
            margin-right: 6px;
        }
        .card-body {
            padding: 30px 28px;
        }
        .form-label {
            font-weight: 500;
            color: #1e293b;
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #dce0e5;
            padding: 10px 14px;
            transition: 0.15s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }
        .btn-primary {
            background: #0d6efd;
            border: none;
            padding: 10px 0;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #0b5ed7;
            transform: scale(1.01);
        }
        .form-text {
            font-size: 13px;
            color: #6c757d;
        }
        .mb-3:last-of-type {
            margin-bottom: 20px !important;
        }
        .image-preview-hint {
            font-size: 13px;
            color: #6c757d;
            background: #f8f9fa;
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 4px;
        }
        .required-star {
            color: #dc3545;
            margin-left: 3px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h5><i class="fas fa-plus-circle me-2"></i> Add New Product</h5>
        <!-- Back button -> admin page -->
        <a href="{% url 'adnhome' %}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    <div class="card-body">

        <form action="{% url 'add_products' %}" method="POST" enctype="multipart/form-data">
             {% csrf_token %}

            <!-- Product Name -->
            <div class="mb-3">
                <label for="pname" class="form-label">
                    Product Name <span class="required-star">*</span>
                </label>
                <input type="text" class="form-control" id="pname" name="pname" placeholder="e.g. Classic White Shirt" required />
            </div>

            <!-- Price -->
            <div class="mb-3">
                <label for="pprice" class="form-label">
                    Price ($) <span class="required-star">*</span>
                </label>
                <input type="number" step="0.01" class="form-control" id="pprice" name="pprice" placeholder="29.99" required />
            </div>
   <label>Category</label>

<select name="category" class="form-control" required>
    <option value="">Select Category</option>
    {% for category in all_category %}
        <option value="{{ category.id }}">{{ category.Category_name }}</option>
    {% empty %}
        <option value="">No categories available</option>
    {% endfor %}
</select> 

            <!-- Description -->
            <div class="mb-3">
                <label for="pdesc" class="form-label">
                    Description <span class="required-star">*</span>
                </label>
                <textarea class="form-control" id="pdesc" name="pdesc" rows="3" placeholder="Short description of the product..." required></textarea>
            </div>

            <!-- Stock -->
            <div class="mb-3">
                <label for="pstock" class="form-label">
                    Stock Quantity <span class="required-star">*</span>
                </label>
                <input type="number" class="form-control" id="pstock" name="pstock" placeholder="e.g. 50" required />
            </div>

            <!-- Image -->
            <div class="mb-4">
                <label for="pimage" class="form-label">
                    Product Image <span class="required-star">*</span>
                </label>
                <input type="file" class="form-control" id="pimage" name="pimage" accept="image/*" required />
                <div class="image-preview-hint">
                    <i class="fas fa-info-circle me-1"></i> JPG, PNG or GIF (max 5MB)
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i> Save Product
            </button>

        </form>

        <!-- Display messages if any -->
        {% if messages %}
            <div class="mt-3">
                {% for msg in messages %}
                    <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
                        {{ msg }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
