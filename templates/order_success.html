<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:'Segoe UI',sans-serif;
        }

        .success-card{
            background:white;
            padding:50px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
            max-width:500px;
        }

        .success-icon{
            font-size:80px;
            color:#28a745;
            margin-bottom:20px;
        }

        h2{
            color:#333;
            font-weight:700;
        }

        p{
            color:#666;
            margin:20px 0;
        }

        .btn-home{
            background:#6c5ce7;
            color:white;
            padding:12px 30px;
            border-radius:30px;
            text-decoration:none;
        }

        .btn-home:hover{
            background:#5a4bd1;
            color:white;
        }
    </style>

</head>
<body>

<div class="success-card">

    <div class="success-icon">
        ✅
    </div>

    <h2>{{ message }}</h2>

    <p>
        Thank you for shopping with <strong>StyleHub</strong>.<br>
        Your order has been placed successfully.
    </p>

    <a href="{% url 'view_customer_products' %}" class="btn-home">
        Continue Shopping
    </a>

</div>

</body>
</html>
