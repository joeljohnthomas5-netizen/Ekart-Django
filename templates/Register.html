<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | StyleHub</title>

{% load static %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(rgba(44,62,80,.75),rgba(52,73,94,.75)),
    url("{% static 'images/banner.jpg' %}");
    background-size:cover;
    background-position:center;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-box{
    width:430px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.back-btn{
    color:#6c5ce7;
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    display:inline-block;
    margin-bottom:15px;
    transition:.3s;
}

.back-btn:hover{
    color:#5a4bd1;
}

.register-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#2d3436;
    font-weight:700;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#555;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    outline:none;
    border-color:#6c5ce7;
    box-shadow:0 0 8px rgba(108,92,231,.25);
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#6c5ce7;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#5a4bd1;
}

.error{
    color:red;
    text-align:center;
    margin-top:12px;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#6c5ce7;
    text-decoration:none;
    font-weight:600;
}

.login-link a:hover{
    text-decoration:underline;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo i{
    font-size:45px;
    color:#ff6b6b;
}

.logo h3{
    color:#2d3436;
    margin-top:8px;
    font-weight:700;
}

</style>

</head>
<body>

<div class="register-box">

    <a href="{% url 'index' %}" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="logo">
        <i class="fas fa-crown"></i>
        <h3>StyleHub</h3>
    </div>

    <h2>Create Account</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Enter your phone number" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit">
            <i class="fas fa-user-plus"></i> Register
        </button>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <div class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </form>

</div>

</body>
</html>
