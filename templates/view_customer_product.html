{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#f5f5f5;
}

.container{
    margin-top:40px;
}

.product-card{
    border:none;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    overflow:hidden;
    transition:.3s;
    background:#fff;
}

.product-card:hover{
    transform:translateY(-5px);
}

.product-card img{
    width:100%;
    height:280px;
    object-fit:scale-down;
}

.product-body{
    padding:15px;
}

.product-name{
    font-size:20px;
    font-weight:bold;
}

.product-price{
    color:green;
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

.product-description{
    color:#555;
    height:60px;
}

.btn-cart{
    width:100%;
}

</style>

</head>
<body>

<div class="container">
<div class="card-header bg-primary text-white d-flex justify-content-between align-items-center p-3">

    <h3 class="mb-0">
        <i class="fas fa-box-open me-2"></i>Our Products
    </h3>

    <div>
        <a href="{% url 'index' %}" class="btn btn-light btn-sm me-2">
            <i class="fas fa-home"></i> Home
        </a>

        <a href="{% url 'profile' %}" class="btn btn-light btn-sm me-2">
            <i class="fas fa-user"></i> Profile
        </a>

        <a href="{% url 'login' %}" class="btn btn-light btn-sm">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

</div>

<div class="row">

{% for product in products %}

<div class="col-md-3 mb-4">

<div class="product-card">

{% if product.Product_image %}
<img src="{{ product.Product_image.url }}" alt="{{ product.Product_name }}">
{% else %}
<img src="{% static 'images/no-image.png' %}" alt="No Image">
{% endif %}

<div class="product-body">

<div class="product-name">
{{ product.Product_name }}
</div>

<div class="product-price">
₹{{ product.Product_price }}
</div>

<div class="product-description">
{{ product.Product_description }}
</div>

<button class="btn btn-primary btn-cart"
{% if product.Product_stock == 0 %}disabled{% endif %}>

<i class="fas fa-shopping-cart"></i>

{% if product.Product_stock == 0 %}
Out of Stock
{% else %}
<a style="color: white; text-decoration: none;" href='addtocart/{{ product.id }}'>Add to Cart</a>
{% endif %}

</button>

</div>

</div>

</div>

{% empty %}

<div class="col-12 text-center">

<h3>No Products Available</h3>

</div>

{% endfor %}

</div>
<script>
    {% if messages %}
        {% for message in messages %}
            alert("{{ message }}");
        {% endfor %}
    {% endif %}
</script>

</div>

</body>
</html>
